
<!DOCTYPE html>
<html>
<head>
    <title>FoodieRest | All Orders</title>
    <link rel="stylesheet" href="admin-orders.css">
</head>
<body>

    <div class="admin-layout">

        <!-- Sidebar -->
        <div class="sidebar">

            <a href="admin-dashboard.html" class="logo">
                <img src="images/logo.svg" alt="Logo">
                <strong>Foodie<span>Rest</span></strong>
            </a>

            <div class="side-menu">
                <a href="admin-dashboard.html">🏠 Dashboard</a>
                <a href="admin-menu.html">🍽️ Manage Menu</a>
                <a href="admin-orders.html" class="active">🧾 All Orders</a>
                <a href="admin-customers.html">👥 Customers</a>
                <a href="#" class="logout" onclick="logout(); return false;">🚪 Logout</a>
            </div>

        </div>

        <!-- Main Content -->
        <div class="admin-main">

            <div class="topbar">
                <div>
                    <h1>All Customer Orders</h1>
                    <p>Admin marks an order Delivered after the kitchen marks it Ready</p>
                </div>

                <div class="user-box">
                    <span class="avatar" id="avatarLetter">A</span>
                    <span id="userName">Hello</span>
                </div>
            </div>

            <!-- Order Heading and Filter -->
            <div class="table-tools">
                <h2 id="orderCount">Orders</h2>

                <select id="statusFilter" name="statusFilter">
                    <option value="All">All status</option>
                    <option value="Pending">Pending</option>
                    <option value="Preparing">Preparing</option>
                    <option value="Ready">Ready</option>
                    <option value="Delivered">Delivered</option>
                </select>
            </div>

            <!-- Orders Table -->
            <div class="table-wrap">

                <table>
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Customer</th>
                            <th>Date & Time</th>
                            <th>Items</th>
                            <th>Total</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="orderRows">
                    </tbody>
                </table>

            </div>

        </div>

    </div>

    <script src="js/storage.js"></script>
    <script src="js/admin.js"></script>

    <script>
        loadAllOrders();
    </script>

</body>
</html>
