
<!DOCTYPE html>
<html>
<head>
    <title>FoodieRest | Add Food</title>
    <link rel="stylesheet" href="admin-add-food.css">
</head>
<body>

    <div class="admin-layout">

        <!-- Sidebar -->
        <div class="sidebar">

            <a href="admin-dashboard.html" class="logo">
                <img src="images/logo.svg" alt="Logo">
                <strong>Foodie<span>Rest</span></strong>
            </a>

            <div class="side-menu">
                <a href="admin-dashboard.html">🏠 Dashboard</a>
                <a href="admin-menu.html" class="active">🍽️ Manage Menu</a>
                <a href="admin-orders.html">🧾 All Orders</a>
                <a href="admin-customers.html">👥 Customers</a>
                <a href="#" class="logout" onclick="logout(); return false;">🚪 Logout</a>
            </div>

        </div>

        <!-- Main Content -->
        <div class="admin-main">

            <div class="topbar">
                <div>
                    <h1>Add New Food Item</h1>
                    <p>Fill in the details to add a food to the menu</p>
                </div>

                <div class="user-box">
                    <span class="avatar" id="avatarLetter">A</span>
                    <span id="userName">Hello</span>
                </div>
            </div>

            <!-- Food Form -->
            <div class="box form-box">

                <form onsubmit="return saveNewFood()">

                    <p id="formMessage" class="form-message"></p>

                    <fieldset>
                        <legend>Food Details</legend>

                        <div class="form-group">
                            <label>Food Name</label>
                            <input type="text" id="foodName" placeholder="Enter food name">
                        </div>

                        <div class="form-row">

                            <div class="form-group">
                                <label>Category</label>
                                <select id="foodCategory">
                                    <option value="">Select category</option>
                                    <option value="Burger">Burger</option>
                                    <option value="Pizza">Pizza</option>
                                    <option value="Rice">Rice</option>
                                    <option value="Chicken">Chicken</option>
                                    <option value="Snacks">Snacks</option>
                                    <option value="Drinks">Drinks</option>
                                    <option value="Desserts">Desserts</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label>Price (Tk)</label>
                                <input type="number" id="price" placeholder="Enter price">
                            </div>

                        </div>

                        <div class="form-group">
                            <label>Description</label>
                            <textarea id="description" rows="3" placeholder="Enter food description"></textarea>
                        </div>

                    </fieldset>

                    <fieldset>
                        <legend>Image and Availability</legend>

                        <div class="current-image">
                            <img src="images/burger.svg" id="imagePreview" alt="Food Image">

                            <div class="form-group">
                                <label>Food Image</label>
                                <select id="foodImage" onchange="showImagePreview()">
                                    <option value="burger.svg">Burger</option>
                                    <option value="pizza.svg">Pizza</option>
                                    <option value="biryani.svg">Biryani</option>
                                    <option value="chicken.svg">Chicken</option>
                                    <option value="fries.svg">Fries</option>
                                    <option value="coffee.svg">Coffee</option>
                                    <option value="lemonade.svg">Juice</option>
                                    <option value="cake.svg">Cake</option>
                                </select>
                            </div>
                        </div>

                        <label class="check-label">
                            <input type="checkbox" id="available" checked>
                            Available for order
                        </label>

                    </fieldset>

                    <div class="form-buttons">
                        <input type="submit" value="Save Item" class="btn btn-primary">
                        <a href="admin-menu.html" class="btn btn-outline">Cancel</a>
                    </div>

                </form>

            </div>

        </div>

    </div>

      <script src="storage.js"></script>
    <script src="admin.js"></script>


    <script>
        loadAddFoodPage();
    </script>

</body>
</html>
