
<!DOCTYPE html>
<html>
<head>
    <title>FoodieRest | Manage Menu</title>
    <link rel="stylesheet" href="admin-menu.css">
</head>
<body>

    <div class="admin-layout">

        <!-- Sidebar -->
        <div class="sidebar">

            <a href="admin-dashboard.html" class="logo">
                <img src="images/logo.svg" alt="Logo">
                <strong>Foodie<span>Rest</span></strong>
            </a>

            <div class="side-menu">
                <a href="admin-dashboard.html">🏠 Dashboard</a>
                <a href="admin-menu.html" class="active">🍽️ Manage Menu</a>
                <a href="admin-orders.html">🧾 All Orders</a>
                <a href="admin-customers.html">👥 Customers</a>
                <a href="#" class="logout" onclick="logout(); return false;">🚪 Logout</a>
            </div>

        </div>

        <!-- Main Content -->
        <div class="admin-main">

            <div class="topbar">
                <div>
                    <h1>Manage Food Menu</h1>
                    <p>Add, edit or delete food items and prices</p>
                </div>

                <a href="admin-add-food.html" class="btn btn-primary">
                    + Add New Item
                </a>
            </div>

            <!-- Search and Category -->
            <div class="table-tools">
                <h2 id="foodCount">All Food Items</h2>

                <div class="tool-form">
                    <input type="search" id="searchFood" placeholder="Search food...">

                    <select id="category">
                        <option value="All">All categories</option>
                        <option value="Burger">Burger</option>
                        <option value="Pizza">Pizza</option>
                        <option value="Rice">Rice</option>
                        <option value="Chicken">Chicken</option>
                        <option value="Snacks">Snacks</option>
                        <option value="Drinks">Drinks</option>
                        <option value="Desserts">Desserts</option>
                    </select>
                </div>
            </div>

            <!-- Food Table -->
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Image</th>
                            <th>Food Name</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Available</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="menuRows">
                    </tbody>
                </table>
            </div>

        </div>

    </div>

    <!-- JavaScript -->
      <script src="storage.js"></script>  
      
    <script src="admin.js"></script>

    <script>
        loadMenuTable();
    </script>

</body>
</html>
