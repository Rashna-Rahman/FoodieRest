
<!DOCTYPE html>
<html>
<head>
    <title>FoodieRest | Edit Customer</title>
    <link rel="stylesheet" href="admin-edit-customer.css">
</head>
<body>

    <div class="admin-layout">

        <!-- Sidebar -->
        <div class="sidebar">

            <a href="admin-dashboard.html" class="logo">
                <img src="images/logo.svg" alt="Logo">
                <strong>Foodie<span>Rest</span></strong>
            </a>

            <div class="side-menu">
                <a href="admin-dashboard.html">🏠 Dashboard</a>
                <a href="admin-menu.html">🍽️ Manage Menu</a>
                <a href="admin-orders.html">🧾 All Orders</a>
                <a href="admin-customers.html" class="active">👥 Customers</a>
                <a href="#" class="logout" onclick="logout(); return false;">🚪 Logout</a>
            </div>

        </div>

        <!-- Main Content -->
        <div class="admin-main">

            <div class="topbar">
                <div>
                    <h1>Edit Customer</h1>
                    <p id="editTitle">Change the customer details</p>
                </div>

                <div class="user-box">
                    <span class="avatar" id="avatarLetter">A</span>
                    <span id="userName">Hello</span>
                </div>
            </div>

            <!-- Edit Form -->
            <div class="form-box">

                <form onsubmit="return updateCustomer()">

                    <p id="formMessage"></p>

                    <fieldset>
                        <legend>Customer Details</legend>

                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" id="fullName" placeholder="Enter full name">
                        </div>

                        <div class="form-row">

                            <div class="form-group">
                                <label>Email</label>
                                <input type="email" id="email" readonly>
                                <p class="hint">Email cannot be changed.</p>
                            </div>

                            <div class="form-group">
                                <label>Phone Number</label>
                                <input type="tel" id="phone" placeholder="01XXXXXXXXX">
                            </div>

                        </div>

                        <div class="form-group">
                            <label>Address</label>
                            <textarea id="address" rows="3" placeholder="Enter address"></textarea>
                        </div>

                    </fieldset>

                    <div class="form-buttons">
                        <input type="submit" value="Update Customer" class="btn">
                        <a href="admin-customers.html" class="cancel">Cancel</a>
                    </div>

                </form>

            </div>

        </div>

    </div>

     <script src="storage.js"></script>
    <script src="admin.js"></script>

    <script>
        loadEditCustomerPage();
    </script>

</body>
</html>
