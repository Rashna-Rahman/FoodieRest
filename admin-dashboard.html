
<!DOCTYPE html>
<html>
<head>
    <title>FoodieRest | Admin Dashboard</title>
    
    <link rel="stylesheet" href="admin-dashboard.css">
</head>
<body>

    <div class="admin-layout">

        <!-- Sidebar -->
        <div class="sidebar">

            <a href="admin-dashboard.html" class="logo">
                <img src="images/logo.svg" alt="Logo">
                <strong>Foodie<span>Rest</span></strong>
            </a>

            <div class="side-menu">
                <a href="admin-dashboard.html" class="active">🏠 Dashboard</a>
                <a href="admin-menu.html">🍽️ Manage Menu</a>
                <a href="admin-orders.html">🧾 All Orders</a>
                <a href="admin-customers.html">👥 Customers</a>
                <a href="#" class="logout" onclick="logout(); return false;">🚪 Logout</a>
            </div>

        </div>

        <!-- Main Content -->
        <div class="admin-main">

            <div class="topbar">
                <div>
                    <h1>Dashboard</h1>
                    <p id="todayText">Overview of today</p>
                </div>

                <div class="user-box">
                    <span class="avatar" id="avatarLetter">A</span>
                    <span id="userName">Hello</span>
                </div>
            </div>

            <!-- Dashboard Cards -->
            <div class="stats">

                <div class="stat-card stat-orange">
                    <div class="stat-icon">🍽️</div>
                    <div>
                        <h2 id="totalMenu">0</h2>
                        <p>Total Menu Items</p>
                    </div>
                </div>

                <div class="stat-card stat-blue">
                    <div class="stat-icon">🧾</div>
                    <div>
                        <h2 id="todayOrders">0</h2>
                        <p>Today's Orders</p>
                    </div>
                </div>

                <div class="stat-card stat-yellow">
                    <div class="stat-icon">⏳</div>
                    <div>
                        <h2 id="pendingOrders">0</h2>
                        <p>Pending Orders</p>
                    </div>
                </div>

                <div class="stat-card stat-green">
                    <div class="stat-icon">✅</div>
                    <div>
                        <h2 id="deliveredToday">0</h2>
                        <p>Delivered Today</p>
                    </div>
                </div>

            </div>

            <!-- Recent Orders -->
            <div class="table-tools">
                <h2>Recent Orders</h2>
                <a href="admin-orders.html" class="btn">View All Orders</a>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Customer</th>
                            <th>Items</th>
                            <th>Total</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody id="recentRows">
                    </tbody>
                </table>
            </div>

        </div>

    </div>

     <script src="storage.js"></script>
    <script src="admin.js"></script>

    <script>
        loadDashboard();
    </script>

</body>
</html>
